<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--surface:#ffffff;--text:#1f2430;--muted:#6b7280;--line:#e5e1d8;
  --accent:#e8743b;--accent-text:#ffffff;--user-bg:#e8743b;--user-text:#ffffff;--bot-bg:#ffffff;--bot-text:#1f2430;--chip:#fff1e8;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16181d;--surface:#20232b;--text:#eceef2;--muted:#9aa1ae;--line:#2d313b;
    --accent:#f08a54;--accent-text:#1a1208;--user-bg:#f08a54;--user-text:#1a1208;--bot-bg:#20232b;--bot-text:#eceef2;--chip:#2a2520;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16181d;--surface:#20232b;--text:#eceef2;--muted:#9aa1ae;--line:#2d313b;
  --accent:#f08a54;--accent-text:#1a1208;--user-bg:#f08a54;--user-text:#1a1208;--bot-bg:#20232b;--bot-text:#eceef2;--chip:#2a2520;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;max-width:760px;margin-inline:auto;line-height:1.6}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:700;font-size:22px}
header h1{font-size:18px;margin:0;line-height:1.2}
header p{margin:0;font-size:13px;color:var(--muted)}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;font-size:15.5px}
.m.bot{align-self:flex-start;background:var(--bot-bg);color:var(--bot-text);border:1px solid var(--line);border-bottom-left-radius:6px}
.m.user{align-self:flex-end;background:var(--user-bg);color:var(--user-text);border-bottom-right-radius:6px}
.m code{background:rgba(127,127,127,.18);padding:1px 5px;border-radius:5px;font-size:.92em}
.m pre{background:rgba(127,127,127,.15);padding:10px;border-radius:10px;overflow-x:auto;margin:6px 0;white-space:pre}
.hello{text-align:center;margin:auto 0;padding:8px}
.hello h2{margin:8px 0 4px;font-size:22px}
.hello p{margin:0 0 16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip:active{transform:scale(.97)}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg)}
textarea{flex:1;resize:none;font:inherit;font-size:16px;padding:10px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--text);max-height:120px;outline:none}
textarea:focus{border-color:var(--accent)}
button.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-text);font-size:20px;cursor:pointer;align-self:flex-end}
button.send:disabled{opacity:.45;cursor:default}
.lnk{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
[hidden]{display:none!important}
#auth{flex:1;display:grid;place-items:center;padding:20px;overflow:auto}
#auth .card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
#auth h2{margin:0 0 4px;font-size:22px;text-align:center}
#auth input{font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);outline:none}
#auth input:focus{border-color:var(--accent)}
#auth button{font:inherit;font-size:15px;padding:11px;border-radius:12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text)}
#auth button.pri{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:500}
.or{text-align:center;color:var(--muted);font-size:13px}
.err{margin:0;min-height:1.2em;color:#d64545;font-size:14px;text-align:center}
.sw{margin:0;text-align:center;font-size:14px;color:var(--muted)}
.sw a{color:var(--accent);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="logo">F</div>
  <div><h1>Faber</h1></div>
  <button id="out" class="lnk" hidden>ออกจากระบบ</button>
</header>
<div id="auth" hidden>
  <div class="card">
    <h2 id="atitle">เข้าสู่ระบบ</h2>
    <button id="g" type="button">ดำเนินการต่อด้วย Google</button>
    <div class="or">หรือ</div>
    <input id="em" type="email" placeholder="อีเมล" autocomplete="email">
    <input id="pw" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)" autocomplete="current-password">
    <button id="sub" class="pri" type="button">เข้าสู่ระบบ</button>
    <p id="err" class="err"></p>
    <p class="sw"><a id="tog">ยังไม่มีบัญชี? สมัครสมาชิก</a> · <a id="fgt">ลืมรหัสผ่าน</a></p>
  </div>
</div>
<div id="msgs">
  <div class="hello" id="hello">
    <h2>สวัสดี! เราชื่อ Faber 👋</h2>
    <p>ถามอะไรก็ได้ คุยกันแบบเพื่อนเลย</p>
    <div class="chips">
      <button class="chip">อธิบายเรื่องยากๆ ให้เข้าใจง่าย</button>
      <button class="chip">ช่วยคิดไอเดีย</button>
      <button class="chip">ช่วยเขียนข้อความ</button>
      <button class="chip">ช่วยวางแผนให้หน่อย</button>
    </div>
  </div>
</div>
<form id="f">
  <textarea id="q" rows="1" placeholder="พิมพ์ถาม Faber ได้เลย…"></textarea>
  <button class="send" id="go" type="submit" aria-label="ส่ง">➤</button>
</form>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function(){
  var $ = function(i){ return document.getElementById(i); };
  var msgs=$("msgs"), q=$("q"), go=$("go"), f=$("f"), auth=$("auth"), out=$("out"), err=$("err");
  var history=[], busy=false, user=null, mode="login";
  msgs.style.display="none"; f.style.display="none";

  var ERR={
    "auth/invalid-credential":"อีเมลหรือรหัสผ่านไม่ถูกต้อง",
    "auth/wrong-password":"อีเมลหรือรหัสผ่านไม่ถูกต้อง",
    "auth/user-not-found":"อีเมลหรือรหัสผ่านไม่ถูกต้อง",
    "auth/email-already-in-use":"อีเมลนี้สมัครไว้แล้ว ลองเข้าสู่ระบบแทน",
    "auth/weak-password":"รหัสผ่านต้องมีอย่างน้อย 6 ตัว",
    "auth/invalid-email":"รูปแบบอีเมลไม่ถูกต้อง",
    "auth/too-many-requests":"ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่",
    "auth/popup-blocked":"เบราว์เซอร์บล็อกหน้าต่าง Google อนุญาตป๊อปอัปแล้วลองใหม่",
    "auth/unauthorized-domain":"โดเมนนี้ยังไม่ได้เพิ่มใน Firebase (Authorized domains)"
  };
  function showErr(e){ if(e && e.code==="auth/popup-closed-by-user") return; err.textContent = ERR[e && e.code] || "มีบางอย่างผิดพลาด ลองใหม่อีกครั้ง"; }

  function esc(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fmt(t){
    var h=esc(t);
    h=h.replace(/```(?:\w+)?\n?([\s\S]*?)```/g,function(_,c){return "<pre>"+c+"</pre>";});
    h=h.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
    return h.replace(/^[-*] /gm,"• ").replace(/^#{1,3} (.*)$/gm,"<b>$1</b>");
  }
  function add(role,text){
    var d=document.createElement("div"); d.className="m "+role;
    if(role==="user") d.textContent=text; else d.innerHTML=text;
    msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d;
  }
  function setBusy(b){ busy=b; go.disabled=b; }

  function show(u){
    user=u; auth.hidden=!!u; out.hidden=!u;
    msgs.style.display=u?"":"none"; f.style.display=u?"":"none";
  }

  fetch("/api/config").then(function(r){return r.json();}).then(function(c){
    if(!c.apiKey || !c.projectId) throw new Error("no config");
    firebase.initializeApp({apiKey:c.apiKey, authDomain:c.projectId+".firebaseapp.com", projectId:c.projectId});
    firebase.auth().onAuthStateChanged(show);
  }).catch(function(){ auth.hidden=false; err.textContent="ระบบล็อกอินยังตั้งค่าไม่เสร็จ"; });

  $("g").onclick=function(){ err.textContent=""; firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(showErr); };
  $("sub").onclick=function(){
    err.textContent="";
    var e=$("em").value.trim(), p=$("pw").value;
    if(!e||!p){ err.textContent="กรอกอีเมลและรหัสผ่านก่อนนะ"; return; }
    var a=firebase.auth();
    (mode==="login"?a.signInWithEmailAndPassword(e,p):a.createUserWithEmailAndPassword(e,p)).catch(showErr);
  };
  $("tog").onclick=function(){
    mode=mode==="login"?"signup":"login"; err.textContent="";
    var s=mode==="signup";
    $("atitle").textContent=s?"สมัครสมาชิก":"เข้าสู่ระบบ";
    $("sub").textContent=s?"สมัครสมาชิก":"เข้าสู่ระบบ";
    $("tog").textContent=s?"มีบัญชีแล้ว? เข้าสู่ระบบ":"ยังไม่มีบัญชี? สมัครสมาชิก";
    $("pw").autocomplete=s?"new-password":"current-password";
  };
  $("fgt").onclick=function(){
    var e=$("em").value.trim();
    if(!e){ err.textContent="กรอกอีเมลก่อน แล้วกดลืมรหัสผ่านอีกครั้ง"; return; }
    firebase.auth().sendPasswordResetEmail(e).then(function(){ err.textContent="ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลแล้ว"; }).catch(showErr);
  };
  out.onclick=function(){ firebase.auth().signOut().then(function(){ location.reload(); }); };

  async function send(text){
    text=(text||"").trim();
    if(!text||busy||!user) return;
    var hello=$("hello"); if(hello) hello.remove();
    add("user",text); history.push({role:"user",content:text});
    q.value=""; q.style.height="auto";
    var bubble=add("bot",'<span class="dots"><span></span><span></span><span></span></span>');
    setBusy(true);
    try{
      var token=await user.getIdToken();
      var res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({messages:history.slice(-12)})});
      var data=await res.json();
      if(res.status===401) throw new Error("auth");
      if(!res.ok) throw new Error(data.error||"error");
      bubble.innerHTML=fmt(data.text); history.push({role:"assistant",content:data.text});
    }catch(e){
      bubble.textContent = e.message==="auth" ? "ล็อกอินหมดอายุ ลองออกจากระบบแล้วเข้าใหม่นะ" : "ขอโทษนะ มีบางอย่างผิดพลาด ลองส่งใหม่อีกครั้ง";
      history.pop();
    }
    setBusy(false); msgs.scrollTop=msgs.scrollHeight;
  }
  f.addEventListener("submit",function(e){ e.preventDefault(); send(q.value); });
  q.addEventListener("input",function(){ q.style.height="auto"; q.style.height=Math.min(q.scrollHeight,120)+"px"; });
  q.addEventListener("keydown",function(e){ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&window.innerWidth>700){ e.preventDefault(); send(q.value); } });
  document.querySelectorAll(".chip").forEach(function(c){ c.addEventListener("click",function(){ send(c.textContent); }); });
})();
</script>
</body>
</html>
